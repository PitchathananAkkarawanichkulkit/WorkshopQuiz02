<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website01</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Monomaniac+One&family=Monsieur+La+Doulaise&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            background-color: #000000;
            margin: 0px;
            padding: 0px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 108px;

        }

        .logo{
            margin-left: -100px;
        }

        .header-bar a {
            font-family: Monomaniac One;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            margin: 0px 20px;
        }

        .header-bar a:hover{
            color: #01D5A2;
        }


        .social i {
            color: #ffffff;
            font-size: 14px;
            margin: 0px 10px;
        }

        .social i:hover{
            color: #01D5A2;
        }

        .info {
            justify-items: center;
            font-family: onomaniac One;
            font-size: 20px;
            color: #ffffff;
            margin-top: 70px;
        }

        #info1 {
            color: #01D5A2;
        }

        .my-image {
            text-align: center;
            margin-top: 50px;
        }

        .my-image img {
            width: 250px;
            height: 250px;
            border: 2px solid #01D5A2;
            padding: 10px;
            border-radius: 250px;
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <div>
            <a href="#">Portfolio</a>
            <a href="#">About</a>
            <a href="#">Get In Touch</a>
        </div>
        <div class="logo">
            <img src="./imagewebsite01/hello.png" alt="hello logo">
        </div>
        <div class="social">
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-linkedin"></i>
        </div>
    </div>
    <div class="info">
        <h1>Pitchathanan Akkarawanichkulkit</h1>
        <h1 id="info1">Freelance Web Developer</h1>
        <h1>Based In Thailand</h1>
    </div>
    <div class="my-image">
        <img src="./imagewebsite01/Me.jpg" alt="my image">
    </div>
</body>

</html>
